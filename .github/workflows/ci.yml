name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install and build
        run: |
          cd apps/web
          npm install
          npm run build

  server:
    name: Server install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: cd server && npm install
